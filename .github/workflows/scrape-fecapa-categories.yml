name: Scrape FECAPA Categories

on:
  # Executa cada dia a les 6:00 UTC (10:00 CET)
  schedule:
    - cron: '0 6 * * *'
  
  # Permet execució manual des de Actions
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Install Chrome (for Puppeteer)
        run: |
          npx puppeteer browsers install chrome
      
      - name: Run FECAPA categories scraper
        run: |
          node api/scraper-fecapa-categories.js --live --output public/fecapa-categories.json
        env:
          NODE_ENV: production
      
      - name: Check for changes
        id: git_status
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=dirty" >> $GITHUB_OUTPUT
            git diff --name-only
          fi
      
      - name: Commit and push changes
        if: steps.git_status.outputs.status == 'dirty'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/fecapa-categories.json
          git commit -m "chore: update FECAPA categories data [automated]"
          git push
      
      - name: Notify if no changes
        if: steps.git_status.outputs.status == 'clean'
        run: echo "✓ No changes to commit"

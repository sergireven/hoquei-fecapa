name: Actualitzar dades per okCat360

on:
  schedule:
    - cron: '0 10 * * 1-5'
    - cron: '0 8 * * 0,6'
    - cron: '0 11 * * 0,6'
    - cron: '0 14 * * 0,6'
    - cron: '0 17 * * 0,6'
    - cron: '0 20 * * 0,6'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    env:
      NODE_ENV: production
      JOK_SEASON: "2026-27"

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Instal·lar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instal·lar dependències
        run: npm ci

      - name: Instal·lar Chrome (Puppeteer)
        run: npx puppeteer browsers install chrome

      - name: Guardar calendari anterior (per detectar canvis)
        run: cp public/data.json "$RUNNER_TEMP/prev-data.json" || true

      - name: Executar scraper sidgad (dades jugadors)
        run: |
          set -euo pipefail
          npm run scrape:sidgad

      - name: Executar scraper categories FECAPA
        run: |
          set -euo pipefail
          node jobs/scraper-fecapa-categories.js \
            --category "NACIONAL CATALANA" \
            --category "PRIMERA CATALANA" \
            --category "SEGONA CATALANA" \
            --category "TERCERA CATALANA" \
            --category FEM \
            --category JUNIOR \
            --category JUVENIL \
            --category INFANTIL \
            --category PREBENJAMI \
            --category BENJAMI \
            --category ALEVI \
            --category VETERANS \
            --competition-timeout-ms 45000 \
            --output public/fecapa-categories.json

      - name: Executar scraper principal
        run: |
          set -euo pipefail
          npm run scrape:on

      - name: Validar sortides mínimes
        run: |
          set -euo pipefail
          test -s public/fecapa-categories.json
          test -s public/data.json
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("public/data.json", "utf8"));
          if (!data || !data.categories || typeof data.categories !== "object") {
            console.error("public/data.json sense categories vàlides");
            process.exit(1);
          }
          const comps = Object.values(data.categories).flat().filter(Boolean);
          if (!comps.length) {
            console.error("public/data.json no conté competicions");
            process.exit(1);
          }
          const withPostSeason = comps.filter(c => c && c.hasPostSeasonPhases === true).length;
          console.log(`Competicions totals: ${comps.length}`);
          console.log(`Competicions amb fases finals: ${withPostSeason}`);
          NODE

      - name: Construir classificacio audit
        run: npm run build:audit

      - name: Construir plantilles per equip (conflictes calendari)
        run: npm run build:rosters

      - name: Calendaris OK Liga (RFEP)
        run: npm run scrape:fep || echo "::warning::No s'han pogut actualitzar els calendaris de la RFEP"

      - name: Avisos de canvis de calendari del club
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFY_MENTION: ${{ github.repository_owner }}
          CLUB_PATTERN: ripollet
          CLUB_LABEL: CH Ripollet
        run: node jobs/club-changes.js --prev "$RUNNER_TEMP/prev-data.json" || echo "::warning::No s'han pogut revisar els canvis del club"

      - name: Commit i push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🏒 Actualitza dades FECAPA"
          file_pattern: public/data.json public/actes/*.json public/jugadors-sidgad.json public/jugadors-sidgad-index.json public/competicions-sidgad.json public/fecapa-categories.json public/classification-audit.json public/entity-mapping.json public/team-rosters.json public/fep-data.json public/club-changes.json

name: Process Audit Feedback Inbox

on:
  workflow_dispatch:

jobs:
  process-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Process inbox feedback files
        run: node api/process-audit-feedback-inbox.js --consume --fail-on-invalid

      - name: Build classification audit snapshot
        run: npm run build:audit

      - name: Check for changes
        id: git_status
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=dirty" >> $GITHUB_OUTPUT
            git diff --name-only
          fi

      - name: Commit and push processed feedback
        if: steps.git_status.outputs.status == 'dirty'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/classification-audit-feedback.json public/classification-audit.json public/entity-mapping.json .github/audit-feedback/inbox .github/audit-feedback/last-process-report.json
          git commit -m "chore: process audit feedback inbox [automated]"
          git push

      - name: Notify if no changes
        if: steps.git_status.outputs.status == 'clean'
        run: echo "✓ No changes to commit"

      - name: Upload process report artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-feedback-process-report
          path: .github/audit-feedback/last-process-report.json

name: Scrape Pilot Finals

on:
  workflow_dispatch:
    inputs:
      jok_comp_id:
        description: "JOK competition ID (leave empty to scrape ALL competitions in PILOT_COMPETITIONS)"
        required: false
        default: ""
      strict_data:
        description: "Fail if no matches are found"
        required: false
        type: boolean
        default: false

jobs:
  scrape-pilot-finals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape pilot finals (FECAPA + JOK)
        run: |
          set -euo pipefail
          STRICT=""
          if [ "${{ github.event.inputs.strict_data }}" = "true" ]; then
            STRICT="--strict"
          fi
          COMP_ID="${{ github.event.inputs.jok_comp_id }}"
          COMP_ARG=""
          if [ -n "$COMP_ID" ]; then
            COMP_ARG="--jok-comp-id $COMP_ID"
          fi
          node api/scrape-pilot-finals.js $COMP_ARG ${STRICT}

      - name: Check for changes
        id: git_status
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=dirty" >> $GITHUB_OUTPUT
            git diff --name-only
          fi

      - name: Commit and push snapshot
        if: steps.git_status.outputs.status == 'dirty'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/pilot-finals-*.json
          COMP_ID="${{ github.event.inputs.jok_comp_id }}"
          MSG="chore: update pilot finals snapshots${COMP_ID:+ ($COMP_ID)} [automated]"
          git commit -m "$MSG"
          git push

      - name: Notify if no changes
        if: steps.git_status.outputs.status == 'clean'
        run: echo "✓ No changes to commit"

name: Manual Sync Trigger

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        type: choice
        default: "github_direct_db_sync"
        options:
          - full_pipeline
          - db_sync_only
          - github_direct_db_sync
      season:
        description: "Season for db_sync_only (all/current/2024-25...)"
        required: false
        default: "all"
      prod_base_url:
        description: "Production base URL"
        required: false
        default: "https://hoquei-fecapa.vercel.app"

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate inputs
        env:
          MODE: ${{ github.event.inputs.mode }}
          SEASON: ${{ github.event.inputs.season }}
          PROD_BASE_URL: ${{ github.event.inputs.prod_base_url }}
        run: |
          set -euo pipefail
          if [ "${MODE}" != "github_direct_db_sync" ] && [ -z "${PROD_BASE_URL:-}" ]; then
            echo "Missing prod_base_url input"
            exit 1
          fi
          if [ "${MODE}" = "db_sync_only" ] && [ -z "${SEASON:-}" ]; then
            echo "Missing season input for db_sync_only"
            exit 1
          fi
          echo "Mode: ${MODE}"
          echo "Season: ${SEASON}"
          echo "Base URL: ${PROD_BASE_URL}"

      - name: Trigger sync endpoint
        if: ${{ github.event.inputs.mode != 'github_direct_db_sync' }}
        env:
          MODE: ${{ github.event.inputs.mode }}
          SEASON: ${{ github.event.inputs.season }}
          PROD_BASE_URL: ${{ github.event.inputs.prod_base_url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ "${MODE}" = "full_pipeline" ]; then
            URL="${PROD_BASE_URL}/api/cron"
          else
            URL="${PROD_BASE_URL}/api/sync-database?season=${SEASON}"
          fi

          echo "Calling: ${URL}"

          CURL_ARGS=(
            --location --show-error --silent
            -H "Accept: application/json"
          )

          if [ -n "${CRON_SECRET:-}" ]; then
            CURL_ARGS+=( -H "Authorization: Bearer ${CRON_SECRET}" )
          else
            echo "Warning: Repository secret CRON_SECRET is not configured. Sending request without Authorization header."
          fi

          HTTP_CODE="$(curl "${CURL_ARGS[@]}" --output sync-response.json --write-out "%{http_code}" "${URL}")"
          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Sync endpoint returned non-success status"
            echo "Response body:"
            cat sync-response.json || true
            exit 1
          fi

      - name: Validate endpoint response
        if: ${{ github.event.inputs.mode != 'github_direct_db_sync' }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('sync-response.json', 'utf8').trim();
          if (!raw) {
            console.error('Empty response');
            process.exit(1);
          }
          let data;
          try {
            data = JSON.parse(raw);
          } catch (err) {
            console.error('Non-JSON response:', raw.slice(0, 300));
            process.exit(1);
          }
          if (!data || data.ok !== true) {
            console.error('Sync endpoint returned failure:', data);
            process.exit(1);
          }
          console.log('Sync OK:', data.message || 'completed');
          if (data.elapsed) console.log('Elapsed:', data.elapsed);
          if (Array.isArray(data.steps)) console.log('Steps:', data.steps.join(' -> '));
          NODE

      - name: Prepare repository for direct sync
        if: ${{ github.event.inputs.mode == 'github_direct_db_sync' }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          npm install --no-audit --no-fund

      - name: Run GitHub-direct JSON -> DB sync
        if: ${{ github.event.inputs.mode == 'github_direct_db_sync' }}
        working-directory: repo
        env:
          SEASON: ${{ github.event.inputs.season }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing required repository secrets: SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { createClient } = require('@supabase/supabase-js');
          const { syncSeasonToDatabase, syncAllSeasonsToDatabase } = require('./api/sync-db-from-json');

          function decodeJwtPayload(token) {
            try {
              const parts = String(token || '').split('.');
              if (parts.length < 2) return null;
              return JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            } catch {
              return null;
            }
          }

          (async () => {
            const season = String(process.env.SEASON || 'all').trim().toLowerCase();
            const jwtPayload = decodeJwtPayload(process.env.SUPABASE_SERVICE_ROLE_KEY || '');
            const role = String(jwtPayload?.role || '').trim();
            if (role && role !== 'service_role') {
              throw new Error(`SUPABASE_SERVICE_ROLE_KEY is not service_role (detected role=${role})`);
            }

            const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
            const publicDir = path.join(process.cwd(), 'public');

            let result;
            if (season === 'all') {
              result = await syncAllSeasonsToDatabase(sb, publicDir);
            } else if (season === 'current') {
              result = await syncSeasonToDatabase(sb, 'current', path.join(publicDir, 'data.json'), '2026-27');
            } else {
              result = await syncSeasonToDatabase(sb, season, path.join(publicDir, 'season-archive', `data-${season}.json`), season);
            }

            const payload = {
              ok: !!result && (season === 'all'
                ? Object.values(result).every(r => r && r.ok === true)
                : result.ok === true),
              mode: 'github_direct_db_sync',
              season,
              result,
              timestamp: new Date().toISOString(),
            };

            if (!payload.ok) {
              payload.error = 'One or more sync steps failed. See result details.';
            }

            fs.writeFileSync('sync-response-direct.json', JSON.stringify(payload, null, 2));
            console.log(JSON.stringify(payload, null, 2));
            if (!payload.ok) process.exit(1);
          })().catch((err) => {
            const payload = {
              ok: false,
              mode: 'github_direct_db_sync',
              error: err?.message || String(err),
              timestamp: new Date().toISOString(),
            };
            fs.writeFileSync('sync-response-direct.json', JSON.stringify(payload, null, 2));
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Validate direct sync response
        if: ${{ github.event.inputs.mode == 'github_direct_db_sync' }}
        working-directory: repo
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('sync-response-direct.json', 'utf8').trim();
          if (!raw) {
            console.error('Empty direct sync response');
            process.exit(1);
          }
          const data = JSON.parse(raw);
          if (!data || data.ok !== true) {
            console.error('Direct sync failed:', data);
            process.exit(1);
          }
          console.log('Direct sync OK:', data.mode, 'season=', data.season);
          NODE
